<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-labelledby="title desc">
<title id="title">Public repository topology</title><desc id="desc">Edges mean only that GitHub reports this primary language for this public repository. No dependency or semantic relationships are inferred.</desc>
<defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" opacity=".5" fill="#1a2c37"/></pattern></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#edf5f7}
.micro{font-size:11px;letter-spacing:1.5px;fill:#91a6b5}.small{font-size:13px;fill:#91a6b5}
.label{font-size:12px;letter-spacing:1.1px}.title{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:-3px}
.packet{animation:travel 28s linear infinite}.led{animation:breathe 24s ease-in-out infinite}.cursor{animation:breathe 4s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:.8}90%{opacity:.8}100%{transform:translateX(880px);opacity:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.packet,.led,.cursor{animation:none}.packet{display:none}}
</style>
<rect width="1080" height="550" rx="12" fill="#080d12"/>
